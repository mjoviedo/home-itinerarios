<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Map</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #e8e6e1; /* Light beige matching your background */
            /* Add your topographical background image here later */
            /* background-image: url('path-to-your-topo-bg.png'); */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            overflow: hidden;
        }

        .map-container {
            width: 800px;
            max-width: 100%;
        }

        /* Styling for the map zones */
        .zone {
            cursor: pointer;
            transition: filter 0.3s ease, transform 0.3s ease;
        }

        .land {
            fill: #5e2f38; /* The burgundy/brown color */
            stroke: #d7cdcb; /* Light border color */
            stroke-width: 4;
            transition: fill 0.3s ease;
        }

        /* Hover effect */
        .zone:hover {
            filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.4));
        }
        
        .zone:hover .land {
            fill: #7a3e49; /* Slightly lighter on hover */
        }

        /* Styling for the circular icons */
        .icon-bg {
            fill: #e8e6e1;
            stroke: #5e2f38;
            stroke-width: 6;
        }

        /* --- THE ANIMATIONS --- */
        /* The SVG paths are drawn in their final "separated" positions.
           The animation starts them shifted towards the center, then moves them to 0,0.
        */
        
        .zone-top-left {
            animation: driftTopLeft 2.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .zone-top-right {
            animation: driftTopRight 2.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .zone-bottom {
            animation: driftBottom 2.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* Adjust the 'from' translate values to push them tighter together */
        @keyframes driftTopLeft {
            from { transform: translate(30px, 20px); opacity: 0; }
            to { transform: translate(0, 0); opacity: 1; }
        }

        @keyframes driftTopRight {
            from { transform: translate(-30px, 20px); opacity: 0; }
            to { transform: translate(0, 0); opacity: 1; }
        }

        @keyframes driftBottom {
            from { transform: translate(0, -35px); opacity: 0; }
            to { transform: translate(0, 0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="map-container">
        <svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
            
            <g class="zone zone-top-left" id="zone1" onclick="handleZoneClick('Northwest Region')">
                <path class="land" d="M 150 150 L 350 120 L 400 250 L 320 320 L 250 280 L 120 300 Z" />
                <g transform="translate(250, 220)">
                    <circle class="icon-bg" cx="0" cy="0" r="40" />
                    <text x="0" y="5" text-anchor="middle" font-size="20" fill="#5e2f38">🏛️</text>
                </g>
            </g>

            <g class="zone zone-top-right" id="zone2" onclick="handleZoneClick('Northeast Region')">
                <path class="land" d="M 420 240 L 450 130 L 650 160 L 620 320 L 480 350 L 410 300 Z" />
                <g transform="translate(530, 240)">
                    <circle class="icon-bg" cx="0" cy="0" r="40" />
                    <text x="0" y="5" text-anchor="middle" font-size="20" fill="#5e2f38">🏛️</text>
                </g>
            </g>

            <g class="zone zone-bottom" id="zone3" onclick="handleZoneClick('Southern Region')">
                <path class="land" d="M 330 350 L 410 320 L 470 370 L 550 480 L 400 550 L 250 450 Z" />
                <g transform="translate(410, 430)">
                    <circle class="icon-bg" cx="0" cy="0" r="40" />
                    <text x="0" y="5" text-anchor="middle" font-size="20" fill="#5e2f38">🏛️</text>
                </g>
            </g>

        </svg>
    </div>

    <script>
        // Simple function to handle the click events
        function handleZoneClick(zoneName) {
            console.log("Clicked: " + zoneName);
            // You can trigger modals, navigation, or content changes here
            alert("You clicked on the " + zoneName + "!");
            
            // Example: window.location.href = '/materiales/' + zoneName.toLowerCase();
        }
    </script>

</body>
</html>
